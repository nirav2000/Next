name: One-time reviewed branch cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-reviewed-branches.yml'
permissions:
  contents: write
jobs:
  cleanup:
    if: github.repository == 'nirav2000/Next' && github.ref == 'refs/heads/main' && github.event.before == '175cf5c9256f5e93a4cb3cf4efe48a315842aa25'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact audited refs and preserved prototype
        shell: bash
        run: |
          set -euo pipefail
          leases=()
          deletes=()
          while IFS='|' read -r name expected proof; do
            test "$name" != main
            ref="refs/heads/$name"
            actual=$(git ls-remote --heads origin "$ref" | awk '{print $1}')
            if [ -z "$actual" ]; then
              echo "Already absent: $name"
              continue
            fi
            if [ "$actual" != "$expected" ]; then
              echo "STOP: branch advanced since the audit: $name"
              exit 1
            fi
            if [ "$proof" = archive ]; then
              git show "$expected:integration/FRENCH_PILOT.md" | cmp - integration/FRENCH_PILOT.md
              git show "$expected:integration/learning-handoff.js" | cmp - integration/learning-handoff.js
            else
              git merge-base --is-ancestor "$proof" "$GITHUB_SHA"
            fi
            leases+=("--force-with-lease=$ref:$expected")
            deletes+=(":$ref")
            echo "Verified: $name"
          done <<'REVIEWED'
          feature/french-curriculum-release|25709511ff1a91118a185f6786d372db639d2de4|c128681605d7f1f8483c3a4347afa4518b905022
          feature/french-learning-dashboard-v1|a2ee853f83e0b0995582402ffc70a1132a669bdd|f79913c7558d7af57c613897329262d034cabd5b
          feature/french-learning-handoff-pilot|a5d173fa90813ecaba25975d1e81790af64f5b08|archive
          feature/french-timed-rest-release|73a00f2269b795461618c2fdbfb693ca22cbbd1d|8302f2b4363be00f420822b30c97324b9869deba
          feature/french-unified-learning-release|4b6a9036aef92c720f95bd463d622019810e50ce|b6c18c6ccd2828c74d4e5e1107074467613d6280
          feature/next-french-magic10-v2|d504513bcaa6801e32a294b1394dc5826ab842c2|911336a5662ae96d2c4c1f423209447811707a98
          feature/unlocking-builder-release|723d5a0b580d48b1950ab5eea904ccd332643751|07e16cdfcc63874aab57984e6d2bf9fdd8d67543
          fix/french-restore-overview-release|593f6b25cbe0502ce5e50fbc58ec744055fdc2fc|86814b2dbaf0a7057c10638cae1b461124678044
          pre-shared-auth|76f62776794f399e927c175a88c0babe4ab30323|76f62776794f399e927c175a88c0babe4ab30323
          REVIEWED
          if [ ${#deletes[@]} -gt 0 ]; then
            git push --atomic "${leases[@]}" origin "${deletes[@]}"
          fi
          echo "Reviewed branch cleanup complete. No main rewrite."
